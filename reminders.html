<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage your reminders." />
    <title>Reminders — Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./auth-gate.css" />
    <style>
      :root {
        color-scheme: light;
        --paper: #fff7f1;
        --indigo: #20209b;
        --board-edge: #20209b;
        --note-paper: #ffffff;
      }

      body {
        background: var(--paper);
        color: var(--indigo);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        max-width: 980px;
      }

      .display-title {
        font-family: "Arial Black", Arial, Helvetica, sans-serif;
        letter-spacing: -0.065em;
        line-height: 0.95;
      }

      .reminder-board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
        align-content: start;
        gap: 2rem;
        width: 100%;
        max-width: 760px;
        aspect-ratio: 1;
        margin-inline: auto;
        padding: 2.5rem;
        overflow-y: auto;
        border: 2px solid var(--board-edge);
        border-radius: 1rem;
        background-color: var(--paper);
        background-image: radial-gradient(var(--indigo) 0.6px, transparent 0.6px);
        background-size: 18px 18px;
      }

      .reminder-note {
        position: relative;
        overflow-wrap: anywhere;
        min-height: 170px;
        padding: 2rem 1.25rem 1.25rem;
        border: 1px solid var(--board-edge);
        border-radius: 0.2rem;
        background: var(--note-paper);
        box-shadow: 0 6px 12px rgb(0 0 0 / 16%);
        text-align: left;
      }

      .reminder-note.note-odd {
        transform: rotate(-2deg);
      }

      .reminder-note.note-even {
        transform: rotate(3deg);
      }

      .reminder-note.notification-target {
        animation: reminder-highlight 1.1s ease-out;
      }

      @keyframes reminder-highlight {
        0% {
          box-shadow: 0 0 0 5px rgb(32 32 155 / 35%), 0 6px 12px rgb(0 0 0 / 16%);
        }

        100% {
          box-shadow: 0 6px 12px rgb(0 0 0 / 16%);
        }
      }

      .schedule-reminder {
        display: block;
        margin-top: 1rem;
        padding: 0.55rem 0.85rem;
        border: 0;
        border-radius: 0.4rem;
        background: var(--indigo);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .pushpin {
        position: absolute;
        top: -13px;
        left: 50%;
        width: 25px;
        height: 25px;
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: var(--indigo);
        box-shadow: 0 2px 4px rgb(0 0 0 / 28%);
        transform: translateX(-50%);
      }

      .reminder-subjects {
        margin: 0.65rem 0 0;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.035em;
      }

      .delete-reminder {
        position: absolute;
        top: 0.4rem;
        right: 0.65rem;
        border: 0;
        background: transparent;
        color: var(--indigo);
        cursor: pointer;
        font-size: 1.5rem;
        line-height: 1;
      }

      .reminder-form {
        width: 100%;
        max-width: 560px;
        margin: 2rem auto 0;
        padding: 1.5rem;
        border: 2px solid var(--board-edge);
        border-radius: 1rem;
        text-align: left;
      }

      .reminder-form label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 700;
      }

      .reminder-form input:not([type="checkbox"]),
      .reminder-form textarea {
        width: 100%;
        margin-bottom: 1rem;
        padding: 0.7rem;
        border: 1px solid var(--board-edge);
        border-radius: 0.35rem;
        background: #ffffff;
        color: var(--indigo);
        font: inherit;
      }

      .subject-picker {
        position: relative;
        margin-bottom: 1rem;
      }

      .subject-picker summary {
        display: flex;
        min-height: 44px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0.7rem;
        border: 1px solid var(--board-edge);
        border-radius: 0.35rem;
        background: #ffffff;
        cursor: pointer;
        list-style: none;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .subject-picker summary::-webkit-details-marker {
        display: none;
      }

      .subject-picker summary::after {
        content: "▾";
        flex: 0 0 auto;
      }

      .subject-picker[open] summary {
        border-radius: 0.35rem 0.35rem 0 0;
      }

      .subject-options {
        position: absolute;
        z-index: 2;
        top: 100%;
        right: 0;
        left: 0;
        display: grid;
        gap: 2px;
        max-height: 240px;
        padding: 6px;
        overflow-y: auto;
        border: 1px solid var(--board-edge);
        border-top: 0;
        border-radius: 0 0 0.35rem 0.35rem;
        background: #ffffff;
        box-shadow: 0 6px 12px rgb(0 0 0 / 14%);
      }

      .subject-option {
        display: flex !important;
        align-items: center;
        gap: 9px;
        margin: 0 !important;
        padding: 7px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.84rem;
      }

      .subject-option:hover {
        background: #f1eef9;
      }

      .subject-option input {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        margin: 0;
        accent-color: var(--indigo);
      }

      .subject-swatch {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        border: 1px solid rgb(32 32 155 / 18%);
        border-radius: 50%;
      }

      .subject-legend {
        margin: 0 0 1rem;
      }

      .subject-legend h3 {
        margin: 0 0 0.6rem;
        font-size: 0.9rem;
      }

      .subject-legend-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .subject-legend-item {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .subject-color-dot {
        width: 0.7rem;
        height: 0.7rem;
        flex: 0 0 0.7rem;
        border: 1px solid rgb(32 32 155 / 18%);
        border-radius: 50%;
      }

      .reminder-form textarea {
        min-height: 100px;
        resize: vertical;
      }

      .add-reminder {
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 0.4rem;
        background: var(--indigo);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button {
        box-shadow:
          0 4px 0 rgb(32 32 155 / 40%),
          0 6px 10px rgb(32 32 155 / 16%),
          inset 0 1px 0 rgb(255 255 255 / 25%);
        transition:
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      button:hover {
        box-shadow:
          0 1px 0 rgb(32 32 155 / 40%),
          0 2px 5px rgb(32 32 155 / 16%),
          inset 0 1px 0 rgb(255 255 255 / 25%);
        transform: translateY(3px);
      }

      button:active {
        box-shadow:
          0 0 0 rgb(32 32 155 / 40%),
          inset 0 1px 0 rgb(255 255 255 / 25%);
        transform: translateY(4px);
      }

      .delete-reminder {
        border-radius: 50%;
      }

      .form-status {
        min-height: 1.5em;
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }

      .reminder-schedule-dialog {
        width: min(100% - 32px, 460px);
        max-width: 460px;
        max-height: min(calc(100dvh - 32px), 680px);
        margin: auto;
        padding: 0;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--indigo);
      }

      .reminder-schedule-dialog::backdrop {
        background: rgb(15 15 48 / 56%);
        backdrop-filter: blur(2px);
      }

      .reminder-schedule-panel {
        display: grid;
        gap: 16px;
        padding: 24px;
        border: 2px solid var(--indigo);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 20px 60px rgb(0 0 0 / 24%);
      }

      .reminder-schedule-dialog[open] .reminder-schedule-panel {
        animation: reminder-pop-in 420ms cubic-bezier(0.2, 1.5, 0.5, 1) both;
      }

      @keyframes reminder-pop-in {
        0% { opacity: 0; transform: scale(0.86) translateY(18px); }
        65% { opacity: 1; transform: scale(1.035) translateY(-4px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      .reminder-schedule-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .reminder-schedule-header h2 {
        margin: 0;
        font-size: 1.3rem;
      }

      .reminder-schedule-panel label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      .reminder-schedule-panel textarea {
        min-height: 90px;
        padding: 0.7rem;
        border: 1px solid var(--board-edge);
        border-radius: 0.35rem;
        background: #ffffff;
        color: var(--indigo);
        font: inherit;
        resize: vertical;
      }

      .reminder-schedule-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .reminder-schedule-status {
        min-height: 1.25em;
        margin: 0;
        font-size: 0.88rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .reminder-schedule-dialog[open] .reminder-schedule-panel {
          animation: none;
        }

        .reminder-note.notification-target {
          animation: none;
          outline: 3px solid var(--indigo);
          outline-offset: 3px;
        }
      }
    </style>
  </head>
  <body class="min-h-screen auth-pending">
    <main class="mx-auto flex w-full flex-col items-center px-4 pb-12 pt-[15vh] text-center">
      <header>
        <a href="index.html" class="display-title text-6xl font-black uppercase text-[#20209b]">Track</a>
        <h1 class="mt-8 text-2xl font-extrabold uppercase">Reminders</h1>
      </header>

      <section aria-labelledby="reminders-board-title" class="mt-8 w-full">
        <h2 id="reminders-board-title" class="mb-8 text-xl font-extrabold uppercase">Your Reminders</h2>
        <div id="reminder-board" class="reminder-board" aria-live="polite" aria-label="Reminder notes"></div>

        <form id="reminder-form" class="reminder-form">
          <h2 class="mb-5 text-xl font-extrabold uppercase">Add a Reminder</h2>
          <label for="reminder-title">Title</label>
          <input id="reminder-title" name="title" type="text" maxlength="160" required />

          <span id="reminder-subject-label" class="mb-2 block font-bold">Subjects</span>
          <details class="subject-picker" id="reminder-subject-picker">
            <summary id="reminder-subject-summary">
              Select subjects
            </summary>
            <div class="subject-options" id="reminder-subject-options" role="group" aria-labelledby="reminder-subject-label"></div>
          </details>

          <section class="subject-legend" aria-labelledby="subject-legend-title">
            <h3 id="subject-legend-title">Subject Color Coding</h3>
            <ul id="subject-legend-list" class="subject-legend-list"></ul>
          </section>

          <label for="reminder-details">Details</label>
          <textarea id="reminder-details" name="details" maxlength="2000" placeholder="Add a few details (optional)"></textarea>

          <button class="add-reminder" type="submit">Add</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <a href="index.html" class="mt-8 font-bold uppercase text-[#20209b] underline">Back to home</a>
    </main>
    <dialog class="reminder-schedule-dialog" id="reminder-schedule-dialog" aria-labelledby="reminder-schedule-title">
      <form class="reminder-schedule-panel" id="reminder-schedule-form">
        <header class="reminder-schedule-header">
          <h2 id="reminder-schedule-title">Schedule a reminder</h2>
          <button id="reminder-schedule-close" type="button" aria-label="Close reminder scheduling">×</button>
        </header>
        <p id="reminder-schedule-for"></p>
        <label>
          Notification date and time
          <input id="reminder-schedule-time" type="datetime-local" required />
        </label>
        <label>
          Additional description (optional)
          <textarea id="reminder-schedule-note" maxlength="500" placeholder="Add a note to include in the notification"></textarea>
        </label>
        <div class="reminder-schedule-actions">
          <button type="submit">Save reminder</button>
          <button id="reminder-schedule-cancel" type="button">Cancel</button>
        </div>
        <p class="reminder-schedule-status" id="reminder-schedule-status" role="status" aria-live="polite"></p>
      </form>
    </dialog>
    <script type="module">
      import {
        createSharedStore,
        getSubjectBackground,
        getSubjectList as normalizeSubjectList,
        getSubjectMap,
      } from "./shared-store.js";
      import { requireSignIn } from "./auth-gate.js";
      import {
        cancelPersonalNotifications,
        schedulePersonalNotification,
      } from "./notification-store.js";
      import { enablePushNotifications } from "./push-client.js";

      const currentUser = await requireSignIn();

      const STORAGE_KEY = "track-reminders";
      const reminderBoard = document.querySelector("#reminder-board");
      const reminderForm = document.querySelector("#reminder-form");
      const titleInput = document.querySelector("#reminder-title");
      const subjectOptions = document.querySelector("#reminder-subject-options");
      const subjectSummary = document.querySelector("#reminder-subject-summary");
      const detailsInput = document.querySelector("#reminder-details");
      const formStatus = document.querySelector("#form-status");
      const subjectLegend = document.querySelector("#subject-legend-list");
      const scheduleDialog = document.querySelector("#reminder-schedule-dialog");
      const scheduleForm = document.querySelector("#reminder-schedule-form");
      const scheduleTime = document.querySelector("#reminder-schedule-time");
      const scheduleNote = document.querySelector("#reminder-schedule-note");
      const scheduleFor = document.querySelector("#reminder-schedule-for");
      const scheduleStatus = document.querySelector("#reminder-schedule-status");
      const subjectColors = {
        MATHEMATICS: "#1D4ED8",
        SCIENCE: "#B91C1C",
        FILIPINO: "#B45309",
        ENGLISH: "#15803D",
        RVE: "#000000",
        AP: "#C000A0",
        TLE: "#0369A1",
        MAPEH: "#7C3AED",
        COMPUTER: "#64748B",
        HOMEROOM: "linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #6366f1, #a855f7)",
      };
      const rainbowBands = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#6366f1", "#a855f7"];
      let reminders = [];
      let activeReminder = null;

      function getSubjectList(record) {
        return normalizeSubjectList(record, subjectColors);
      }

      function renderSubjectPicker() {
        Object.keys(subjectColors).forEach((subject) => {
          const label = document.createElement("label");
          label.className = "subject-option";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "subjects";
          checkbox.value = subject;
          checkbox.defaultChecked = subject === "MATHEMATICS";
          checkbox.checked = checkbox.defaultChecked;
          checkbox.addEventListener("change", updateSubjectSummary);

          const swatch = document.createElement("span");
          swatch.className = "subject-swatch";
          swatch.style.background = subjectColors[subject];
          swatch.setAttribute("aria-hidden", "true");

          label.append(checkbox, swatch, document.createTextNode(subject));
          subjectOptions.append(label);
        });
        updateSubjectSummary();
      }

      function getSelectedSubjects() {
        return [...subjectOptions.querySelectorAll('input[name="subjects"]:checked')]
          .map((checkbox) => checkbox.value);
      }

      function updateSubjectSummary() {
        const selected = getSelectedSubjects();
        subjectSummary.textContent = selected.length
          ? selected.join(", ")
          : "Select subjects";
      }

      function renderSubjectLegend() {
        Object.entries(subjectColors).forEach(([subject, color]) => {
          const item = document.createElement("li");
          item.className = "subject-legend-item";

          const dot = document.createElement("span");
          dot.className = "subject-color-dot";
          dot.style.background = color;
          dot.setAttribute("aria-hidden", "true");

          item.append(dot, document.createTextNode(subject));
          subjectLegend.append(item);
        });
      }

      function setStatus(message) {
        formStatus.textContent = message;
      }

      function loadLegacyReminders() {
        try {
          const savedReminders = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(savedReminders)) {
            throw new Error("Saved reminder data has an invalid format.");
          }

          return savedReminders
            .filter(
              (reminder) =>
                reminder &&
                typeof reminder.id === "string" &&
                typeof reminder.title === "string" &&
                typeof reminder.details === "string",
            )
            .map((reminder) => {
              const legacyReminder = { ...reminder };
              delete legacyReminder.subject;
              const subjects = getSubjectList(reminder);
              return {
                ...legacyReminder,
                subjects: getSubjectMap(subjects.length ? subjects : ["MATHEMATICS"]),
              };
            });
        } catch (error) {
          setStatus(`Could not load saved reminders: ${error.message}`);
          console.error("Unable to load legacy reminders:", error);
          return [];
        }
      }

      function createReminderNote(reminder, index) {
        const note = document.createElement("article");
        note.className = `reminder-note ${index % 2 === 0 ? "note-odd" : "note-even"}`;
        note.dataset.reminderId = reminder.id;
        note.tabIndex = -1;

        const pushpin = document.createElement("span");
        pushpin.className = "pushpin";
        pushpin.setAttribute("aria-hidden", "true");
        const subjects = getSubjectList(reminder);
        pushpin.style.background = getSubjectBackground(
          subjects,
          subjectColors,
          rainbowBands,
        );

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-reminder";
        deleteButton.type = "button";
        deleteButton.dataset.deleteId = reminder.id;
        deleteButton.setAttribute("aria-label", `Delete reminder: ${reminder.title}`);
        deleteButton.textContent = "×";

        const scheduleButton = document.createElement("button");
        scheduleButton.className = "schedule-reminder";
        scheduleButton.type = "button";
        scheduleButton.dataset.scheduleId = reminder.id;
        scheduleButton.textContent = "Set a reminder";

        const title = document.createElement("h3");
        title.className = "text-lg font-extrabold uppercase";
        title.textContent = reminder.title;
        title.style.color = subjectColors[subjects[0]];

        note.append(pushpin, deleteButton, title);
        const subjectNames = document.createElement("p");
        subjectNames.className = "reminder-subjects";
        subjectNames.textContent = subjects.join(" · ");
        note.append(subjectNames);
        if (reminder.details) {
          const details = document.createElement("p");
          details.className = "mt-3 text-sm leading-relaxed";
          details.textContent = reminder.details;
          note.append(details);
        }
        note.append(scheduleButton);
        return note;
      }

      function focusRequestedReminder() {
        const requestedReminderId = new URLSearchParams(window.location.search).get("reminder");
        if (!requestedReminderId) return;
        const note = [...reminderBoard.children].find(
          (item) => item.dataset.reminderId === requestedReminderId,
        );
        if (!note) return;
        note.classList.add("notification-target");
        note.scrollIntoView({ behavior: "smooth", block: "center" });
        note.focus({ preventScroll: true });
        window.history.replaceState(null, "", window.location.pathname);
      }

      function renderReminders() {
        reminderBoard.replaceChildren();
        if (reminders.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.textContent = "Your board is empty. Add a reminder below.";
          reminderBoard.append(emptyMessage);
          return;
        }
        reminders.forEach((reminder, index) => {
          reminderBoard.append(createReminderNote(reminder, index));
        });
        focusRequestedReminder();
      }

      renderSubjectLegend();
      renderSubjectPicker();
      renderReminders();

      let sharedStore = null;
      try {
        sharedStore = createSharedStore();
        sharedStore.watch(
          "reminders",
          (items) => {
            reminders = items.filter(
              (reminder) =>
                reminder &&
                typeof reminder.id === "string" &&
                typeof reminder.title === "string" &&
                typeof reminder.details === "string" &&
                getSubjectList(reminder).length > 0,
            )
            .map((reminder) => ({
              ...reminder,
              subjects: getSubjectMap(getSubjectList(reminder)),
            }));
            renderReminders();
            setStatus("Connected to live shared reminders.");
          },
          (error) => {
            setStatus(`Could not sync reminders: ${error.message}`);
            console.error("Unable to sync shared reminders:", error);
          },
        );
        void sharedStore
          .importLegacy("reminders", loadLegacyReminders())
          .then((count) => {
            if (count > 0) {
              setStatus(`Imported ${count} saved reminder(s) to the shared board.`);
            }
          })
          .catch((error) => {
            setStatus(`Could not import saved reminders: ${error.message}`);
            console.error("Unable to import legacy reminders:", error);
          });
      } catch (error) {
        setStatus(error.message);
      }

      reminderForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) {
          titleInput.focus();
          setStatus("Enter a title for your reminder.");
          return;
        }

        const subjects = getSelectedSubjects();
        if (subjects.length === 0) {
          setStatus("Select at least one subject.");
          subjectSummary.focus();
          return;
        }

        if (!sharedStore) {
          setStatus("Shared sync is not configured. Follow FIREBASE_SETUP.md.");
          return;
        }

        try {
          await sharedStore.add("reminders", {
            title,
            subjects: getSubjectMap(subjects),
            details: detailsInput.value.trim(),
          });
          setStatus("Reminder added to the shared board.");
          reminderForm.reset();
          updateSubjectSummary();
          titleInput.focus();
        } catch (error) {
          setStatus(`Could not add reminder: ${error.message}`);
          console.error("Unable to add shared reminder:", error);
        }
      });

      reminderBoard.addEventListener("click", (event) => {
        if (!(event.target instanceof Element)) return;
        const scheduleButton = event.target.closest("[data-schedule-id]");
        if (scheduleButton) {
          const reminder = reminders.find((item) => item.id === scheduleButton.dataset.scheduleId);
          if (reminder) {
            activeReminder = reminder;
            scheduleFor.textContent = `For: ${reminder.title}`;
            const earliestTime = new Date(Date.now() + 60_000);
            const localEarliestTime = new Date(
              earliestTime.getTime() - earliestTime.getTimezoneOffset() * 60_000,
            );
            scheduleTime.min = localEarliestTime.toISOString().slice(0, 16);
            scheduleTime.value = "";
            scheduleNote.value = "";
            scheduleStatus.textContent = "";
            scheduleDialog.showModal();
            scheduleTime.focus();
          }
          return;
        }
        const deleteButton = event.target.closest("[data-delete-id]");
        if (!deleteButton) return;
        if (!sharedStore) {
          setStatus("Shared sync is not configured. Follow FIREBASE_SETUP.md.");
          return;
        }
        const reminderId = deleteButton.dataset.deleteId;
        void (async () => {
          try {
            await sharedStore.delete("reminders", reminderId);
          } catch (error) {
            setStatus(`Could not delete reminder: ${error.message}`);
            console.error("Unable to delete shared reminder:", error);
            return;
          }
          setStatus("Reminder deleted from the shared board.");
          try {
            const canceledCount = await cancelPersonalNotifications(currentUser, "reminder", reminderId);
            if (canceledCount) {
              setStatus("Reminder deleted; your pending notifications were canceled.");
            }
          } catch (error) {
            setStatus(`Reminder deleted, but pending notifications could not be canceled: ${error.message}`);
            console.error("Unable to cancel notifications for deleted reminder:", error);
          }
        })();
      });

      scheduleForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!activeReminder) return;
        const scheduledAt = new Date(scheduleTime.value).getTime();
        if (!Number.isFinite(scheduledAt) || scheduledAt <= Date.now()) {
          scheduleStatus.textContent = "Choose a notification time in the future.";
          scheduleTime.focus();
          return;
        }

        const submitButton = scheduleForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          await enablePushNotifications(currentUser);
          await schedulePersonalNotification(currentUser, {
            scheduledAt,
            title: `Reminder: ${activeReminder.title}`,
            body: scheduleNote.value.trim() || activeReminder.details || "Your scheduled reminder is due.",
            targetType: "reminder",
            targetId: activeReminder.id,
          });
          setStatus("Your personal reminder is scheduled.");
          scheduleStatus.textContent = "Your personal reminder is scheduled.";
          scheduleDialog.close();
        } catch (error) {
          scheduleStatus.textContent = error.message;
          console.error("Unable to schedule reminder notification:", error);
        } finally {
          submitButton.disabled = false;
        }
      });

      document.querySelector("#reminder-schedule-close").addEventListener("click", () => {
        scheduleDialog.close();
      });
      document.querySelector("#reminder-schedule-cancel").addEventListener("click", () => {
        scheduleDialog.close();
      });
      scheduleDialog.addEventListener("click", (event) => {
        if (event.target === scheduleDialog) scheduleDialog.close();
      });
    </script>
  </body>
</html>
