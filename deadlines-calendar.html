<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan school tasks and important dates in your monthly calendar."
    />
    <title>School Calendar — Track</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fffbf4;
        --navy: #20209b;
        --navy-light: #4141b7;
        --muted: #68688d;
        --line: #d6d4e7;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--paper);
        color: var(--navy);
        font-family: Arial, Helvetica, sans-serif;
      }

      a {
        color: inherit;
      }

      .page {
        width: min(100% - 32px, 1040px);
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 24px;
        font-size: 0.95rem;
        font-weight: 700;
        text-underline-offset: 3px;
      }

      .back-link:focus-visible,
      button:focus-visible,
      input:focus-visible,
      .subject-picker summary:focus-visible {
        outline: 3px solid var(--navy-light);
        outline-offset: 3px;
      }

      header {
        margin-bottom: 28px;
        text-align: center;
      }

      .brand {
        margin: 0;
        font-family: "Arial Black", Arial, Helvetica, sans-serif;
        font-size: clamp(2.8rem, 8vw, 4.5rem);
        letter-spacing: -0.065em;
        line-height: 0.95;
        text-transform: uppercase;
      }

      header p {
        margin: 10px 0 0;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
        align-items: start;
        gap: 24px;
      }

      .task-panel,
      .calendar-panel {
        min-width: 0;
        border: 2px solid var(--navy);
        border-radius: 14px;
        background: var(--paper);
      }

      .task-panel {
        padding: 20px;
      }

      .task-panel h2 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .task-panel p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .task-form {
        display: grid;
        min-width: 0;
        gap: 14px;
      }

      .task-form > div,
      .task-form > button,
      .task-form > section {
        min-width: 0;
        max-width: 100%;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--navy-light);
        border-radius: 8px;
        background: var(--white);
        color: var(--navy);
        font: inherit;
      }

      .subject-picker {
        position: relative;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      .subject-picker summary {
        display: flex;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 44px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--navy-light);
        border-radius: 8px;
        background: var(--white);
        cursor: pointer;
        list-style: none;
        overflow: hidden;
      }

      .subject-picker summary > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .subject-picker summary::-webkit-details-marker {
        display: none;
      }

      .subject-picker summary::after {
        content: "▾";
        flex: 0 0 auto;
      }

      .subject-picker[open] summary {
        border-color: var(--navy);
        border-radius: 8px 8px 0 0;
      }

      .subject-options {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        display: grid;
        gap: 2px;
        max-height: 240px;
        padding: 6px;
        overflow-y: auto;
        border: 1px solid var(--navy-light);
        border-radius: 8px;
        background: var(--white);
        box-shadow: 0 6px 12px rgb(32 32 155 / 14%);
      }

      .subject-picker[open] .subject-options {
        margin-top: 6px;
      }

      .subject-option {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.84rem;
      }

      .subject-option:hover {
        background: #f1eef9;
      }

      .subject-option input {
        width: 16px;
        min-height: 16px;
        height: 16px;
        flex: 0 0 16px;
        margin: 0;
        padding: 0;
        accent-color: var(--navy);
      }

      .subject-swatch {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        border: 1px solid rgb(32 32 155 / 18%);
        border-radius: 50%;
      }

      input::placeholder {
        color: #77778e;
      }

      button {
        min-height: 42px;
        padding: 9px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--navy);
        color: var(--paper);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: background-color 140ms ease;
      }

      button:hover {
        background: #3030ad;
      }

      .color-legend {
        margin-top: 18px;
      }

      .color-legend h3 {
        margin: 0 0 10px;
        font-size: 0.95rem;
      }

      .legend-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .legend-item {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 7px;
        font-size: 0.73rem;
        font-weight: 700;
      }

      .legend-dot {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        border: 1px solid rgb(32 32 155 / 18%);
        border-radius: 50%;
      }

      .task-subjects {
        display: block;
        margin-top: 3px;
        font-size: 0.62rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .deadline-dialog {
        width: min(100% - 32px, 520px);
        max-width: 520px;
        max-height: min(calc(100dvh - 32px), 720px);
        margin: auto;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--navy);
      }

      .deadline-dialog::backdrop {
        background: rgb(15 15 48 / 56%);
        backdrop-filter: blur(2px);
      }

      .deadline-dialog-panel {
        display: grid;
        max-height: min(calc(100dvh - 32px), 720px);
        gap: 20px;
        padding: clamp(20px, 5vw, 30px);
        overflow-y: auto;
        border: 2px solid var(--navy);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 20px 60px rgb(0 0 0 / 24%);
      }

      .deadline-dialog-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: start;
        gap: 12px;
        margin: 0;
        text-align: left;
      }

      .deadline-dialog-date {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-align: right;
      }

      .deadline-dialog-date-text {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .deadline-date-edit-button {
        min-width: 32px;
        min-height: 32px;
        padding: 6px;
      }

      .deadline-dialog-title-row {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        min-width: 0;
        align-items: flex-start;
        gap: 8px;
      }

      .deadline-dialog-title {
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
        font-size: clamp(1.25rem, 5vw, 1.65rem);
        line-height: 1.2;
      }

      .icon-button {
        display: inline-flex;
        min-width: 38px;
        min-height: 38px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }

      .deadline-dialog-close {
        grid-column: 3;
        grid-row: 1;
        min-width: 38px;
        min-height: 38px;
        padding: 4px;
        font-size: 1.5rem;
        line-height: 1;
      }

      .deadline-edit-form {
        display: grid;
        gap: 10px;
      }

      .deadline-edit-form[hidden],
      .deadline-date-form[hidden],
      .deadline-delete-confirmation[hidden] {
        display: none;
      }

      .deadline-dialog-actions,
      .deadline-edit-actions,
      .deadline-delete-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .deadline-subject-heading {
        margin: 0 0 10px;
        font-size: 0.92rem;
      }

      .deadline-subject-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .deadline-subject-tag {
        max-width: 100%;
        padding: 7px 10px;
        overflow-wrap: anywhere;
        border: 1px solid rgb(32 32 155 / 18%);
        border-radius: 999px;
        background: var(--subject-color);
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .deadline-subject-tag.is-rainbow {
        color: #20209b;
      }

      .deadline-delete-button {
        background: #b42318;
        color: #ffffff;
      }

      .deadline-delete-button:hover {
        background: #8f1c13;
      }

      .deadline-delete-confirmation {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid #e5a29d;
        border-radius: 10px;
        background: #fff1f0;
      }

      .deadline-delete-confirmation p {
        margin: 0;
        color: #7a271a;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .deadline-dialog-status {
        min-height: 1.25em;
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .calendar-panel {
        min-width: 0;
        overflow: hidden;
      }

      .calendar-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border-bottom: 2px solid var(--navy);
      }

      .calendar-toolbar h2 {
        margin: 0;
        text-align: center;
        font-size: clamp(1.15rem, 3vw, 1.5rem);
      }

      .calendar-toolbar button {
        min-width: 84px;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .weekday,
      .day {
        min-width: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .weekday:nth-child(7n),
      .day:nth-child(7n) {
        border-right: 0;
      }

      .weekday {
        padding: 11px 4px;
        background: #f1eef9;
        color: var(--navy);
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
      }

      .day {
        min-height: 112px;
        padding: 8px;
      }

      .day.is-outside-month {
        background: #f8f6f1;
        color: #85849b;
      }

      .day-number {
        display: inline-flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .day.is-today .day-number {
        background: var(--navy);
        color: var(--paper);
      }

      .task-list {
        display: grid;
        gap: 4px;
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
      }

      .task-badge {
        display: block;
        width: 100%;
        min-width: 0;
        overflow-wrap: anywhere;
        padding: 4px 6px;
        border-radius: 7px;
        background: var(--navy);
        color: #ffffff;
        cursor: pointer;
        font-size: 0.75rem;
        line-height: 1.25;
        text-align: left;
      }

      .task-badge:hover {
        background-color: var(--badge-color);
        text-decoration: underline;
      }

      .status {
        min-height: 1.25em;
        margin: 12px 0 0;
        color: var(--navy);
        font-size: 0.9rem;
      }

      @media (max-width: 720px) {
        .content {
          grid-template-columns: 1fr;
        }

        .task-panel {
          order: 1;
        }

        .calendar-panel {
          order: 2;
        }

        .day {
          min-height: 92px;
          padding: 5px;
        }
      }

      @media (max-width: 420px) {
        .page {
          width: min(100% - 20px, 1040px);
          padding-top: 18px;
        }

        .calendar-toolbar {
          padding: 12px 8px;
          gap: 6px;
        }

        .calendar-toolbar button {
          min-width: 68px;
          padding: 8px;
          font-size: 0.88rem;
        }

        .weekday {
          padding: 9px 1px;
          font-size: 0.72rem;
        }

        .day {
          min-height: 76px;
          padding: 3px;
        }

        .day-number {
          width: 24px;
          height: 24px;
          font-size: 0.8rem;
        }

        .task-badge {
          padding: 2px;
          font-size: 0.66rem;
        }

        .deadline-dialog-header {
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .deadline-dialog-date {
          grid-column: 1;
          grid-row: 2;
          justify-content: flex-start;
          margin: 0;
          text-align: left;
        }

        .deadline-dialog-close {
          grid-column: 2;
          grid-row: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="index.html">Back to Main Menu</a>

      <header>
        <h1 class="brand">Track</h1>
        <p>School Calendar</p>
      </header>

      <div class="content">
        <section class="task-panel" aria-labelledby="task-heading">
          <h2 id="task-heading">Add a DEADLINE</h2>
          <p>Choose a date to place your deadline on the calendar.</p>
          <form class="task-form" id="task-form">
            <div>
              <label class="field-label" for="task-description">Deadline description</label>
              <input
                id="task-description"
                name="description"
                type="text"
                placeholder="Enter Deadline Description"
                maxlength="160"
                required
              />
            </div>
            <div>
              <span class="field-label" id="task-subject-label">Subjects</span>
              <details class="subject-picker" id="task-subject-picker">
                <summary id="task-subject-summary">
                  <span id="task-subject-selection">Select subjects</span>
                </summary>
                <div class="subject-options" id="task-subject-options" role="group" aria-labelledby="task-subject-label"></div>
              </details>
            </div>
            <div>
              <label class="field-label" for="task-date">Date</label>
              <input id="task-date" name="date" type="date" required />
            </div>
            <button type="submit">Add Task</button>
            <section class="color-legend" aria-labelledby="legend-heading">
              <h3 id="legend-heading">Color Coding</h3>
              <ul class="legend-list" id="color-legend"></ul>
            </section>
          </form>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </section>

        <section class="calendar-panel" aria-labelledby="month-heading">
          <div class="calendar-toolbar">
            <button id="previous-month" type="button" aria-label="Show previous month">
              Previous
            </button>
            <h2 id="month-heading" aria-live="polite"></h2>
            <button id="next-month" type="button" aria-label="Show next month">
              Next
            </button>
          </div>
          <div class="calendar-grid" id="calendar-grid" role="grid" aria-labelledby="month-heading"></div>
        </section>
      </div>

      <dialog class="deadline-dialog" id="deadline-dialog" aria-labelledby="deadline-dialog-title">
        <div class="deadline-dialog-panel">
          <header class="deadline-dialog-header">
            <div class="deadline-dialog-title-row">
              <h2 class="deadline-dialog-title" id="deadline-dialog-title"></h2>
              <button class="icon-button" id="deadline-edit-button" type="button" aria-label="Edit deadline name" title="Edit deadline name">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
                </svg>
              </button>
            </div>
            <div class="deadline-dialog-date">
              <p class="deadline-dialog-date-text" id="deadline-dialog-date"></p>
              <button class="deadline-date-edit-button" id="deadline-date-edit-button" type="button" aria-label="Change deadline date" title="Change deadline date">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <path d="M16 2v4M8 2v4M3 10h18"></path>
                </svg>
              </button>
            </div>
            <button class="deadline-dialog-close" id="deadline-dialog-close" type="button" aria-label="Close deadline details">×</button>
          </header>

          <form class="deadline-edit-form" id="deadline-edit-form" hidden>
            <label class="field-label" for="deadline-edit-name">Deadline name</label>
            <input id="deadline-edit-name" type="text" maxlength="160" required />
            <div class="deadline-edit-actions">
              <button type="submit">Save changes</button>
              <button id="deadline-edit-cancel" type="button">Cancel</button>
            </div>
          </form>

          <form class="deadline-date-form" id="deadline-date-form" hidden>
            <label class="field-label" for="deadline-edit-date">Deadline date</label>
            <input id="deadline-edit-date" type="date" required />
            <div class="deadline-edit-actions">
              <button type="submit">Save date</button>
              <button id="deadline-date-cancel" type="button">Cancel</button>
            </div>
          </form>

          <section aria-labelledby="deadline-dialog-subject-heading">
            <h3 class="deadline-subject-heading" id="deadline-dialog-subject-heading">Subjects</h3>
            <div class="deadline-subject-tags" id="deadline-dialog-subjects"></div>
          </section>

          <div class="deadline-dialog-actions" id="deadline-dialog-actions">
            <button class="deadline-delete-button" id="deadline-delete-button" type="button">Delete Deadline</button>
          </div>

          <section class="deadline-delete-confirmation" id="deadline-delete-confirmation" hidden aria-label="Confirm deadline deletion">
            <p>Delete this deadline? This will remove it from the shared calendar for everyone.</p>
            <div class="deadline-delete-actions">
              <button class="deadline-delete-button" id="deadline-delete-confirm" type="button">Yes, delete</button>
              <button id="deadline-delete-cancel" type="button">Cancel</button>
            </div>
          </section>

          <p class="deadline-dialog-status" id="deadline-dialog-status" role="status" aria-live="polite"></p>
        </div>
      </dialog>
    </main>

    <script type="module">
      import {
        createSharedStore,
        getSubjectBackground,
        getSubjectList as normalizeSubjectList,
        getSubjectMap,
      } from "./shared-store.js";

      const calendarGrid = document.querySelector("#calendar-grid");
      const monthHeading = document.querySelector("#month-heading");
      const taskForm = document.querySelector("#task-form");
      const descriptionInput = document.querySelector("#task-description");
      const subjectOptions = document.querySelector("#task-subject-options");
      const subjectSelection = document.querySelector("#task-subject-selection");
      const dateInput = document.querySelector("#task-date");
      const formStatus = document.querySelector("#form-status");
      const deadlineDialog = document.querySelector("#deadline-dialog");
      const deadlineDialogDate = document.querySelector("#deadline-dialog-date");
      const deadlineDialogTitle = document.querySelector("#deadline-dialog-title");
      const deadlineDialogSubjects = document.querySelector("#deadline-dialog-subjects");
      const deadlineDialogStatus = document.querySelector("#deadline-dialog-status");
      const deadlineEditButton = document.querySelector("#deadline-edit-button");
      const deadlineEditForm = document.querySelector("#deadline-edit-form");
      const deadlineEditName = document.querySelector("#deadline-edit-name");
      const deadlineDateEditButton = document.querySelector("#deadline-date-edit-button");
      const deadlineDateForm = document.querySelector("#deadline-date-form");
      const deadlineEditDate = document.querySelector("#deadline-edit-date");
      const deadlineDeleteConfirmation = document.querySelector("#deadline-delete-confirmation");
      const storageKey = "track-school-calendar-tasks";
      const subjectColors = {
        MATHEMATICS: "#1D4ED8",
        SCIENCE: "#B91C1C",
        FILIPINO: "#B45309",
        ENGLISH: "#15803D",
        RVE: "#000000",
        AP: "#C000A0",
        TLE: "#0369A1",
        MAPEH: "#7C3AED",
        COMPUTER: "#64748B",
        HOMEROOM: "linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #6366f1, #a855f7)",
      };
      const rainbowBands = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#6366f1", "#a855f7"];
      let tasks = [];
      let sharedStore = null;
      let activeDeadlineId = null;
      let dialogTrigger = null;
      const today = new Date();
      let displayedYear = today.getFullYear();
      let displayedMonth = today.getMonth();

      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      function getSubjectList(record) {
        return normalizeSubjectList(record, subjectColors);
      }

      function renderSubjectPicker() {
        Object.keys(subjectColors).forEach((subject) => {
          const label = document.createElement("label");
          label.className = "subject-option";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "subjects";
          checkbox.value = subject;
          checkbox.defaultChecked = subject === "MATHEMATICS";
          checkbox.checked = checkbox.defaultChecked;
          checkbox.addEventListener("change", updateSubjectSummary);

          const swatch = document.createElement("span");
          swatch.className = "subject-swatch";
          swatch.style.background = subjectColors[subject];
          swatch.setAttribute("aria-hidden", "true");

          label.append(checkbox, swatch, document.createTextNode(subject));
          subjectOptions.append(label);
        });
        updateSubjectSummary();
      }

      function getSelectedSubjects() {
        return [...subjectOptions.querySelectorAll('input[name="subjects"]:checked')]
          .map((checkbox) => checkbox.value);
      }

      function updateSubjectSummary() {
        const selected = getSelectedSubjects();
        subjectSelection.textContent = selected.length
          ? selected.length > 2
            ? `${selected.slice(0, 2).join(", ")} +${selected.length - 2} more`
            : selected.join(", ")
          : "Select subjects";
      }

      function renderColorLegend() {
        const legend = document.querySelector("#color-legend");
        Object.entries(subjectColors).forEach(([subject, color]) => {
          const item = document.createElement("li");
          const dot = document.createElement("span");

          item.className = "legend-item";
          dot.className = "legend-dot";
          dot.style.background = color;
          dot.setAttribute("aria-hidden", "true");
          item.append(dot, document.createTextNode(subject));
          legend.append(item);
        });
      }

      function formatDateKey(year, month, day) {
        return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      function formatDeadlineDate(dateKey) {
        const [year, month, day] = dateKey.split("-").map(Number);
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "full",
        }).format(new Date(year, month - 1, day));
      }

      function renderDeadlineDialog(task) {
        deadlineDialogDate.textContent = formatDeadlineDate(task.date);
        deadlineDialogTitle.textContent = task.description;
        deadlineDialogSubjects.replaceChildren();

        getSubjectList(task).forEach((subject) => {
          const tag = document.createElement("span");
          tag.className = "deadline-subject-tag";
          tag.textContent = subject;
          tag.style.setProperty("--subject-color", subjectColors[subject]);
          if (subject === "HOMEROOM") tag.classList.add("is-rainbow");
          deadlineDialogSubjects.append(tag);
        });
      }

      function openDeadlineDialog(taskId, trigger) {
        const task = tasks.find((item) => item.id === taskId);
        if (!task) return;
        activeDeadlineId = taskId;
        dialogTrigger = trigger;
        deadlineDialogStatus.textContent = "";
        deadlineEditForm.hidden = true;
        deadlineDateForm.hidden = true;
        deadlineEditButton.disabled = false;
        deadlineDateEditButton.disabled = false;
        deadlineDeleteConfirmation.hidden = true;
        document.querySelector("#deadline-dialog-actions").hidden = false;
        renderDeadlineDialog(task);
        deadlineDialog.showModal();
        document.querySelector("#deadline-dialog-close").focus();
      }

      function closeDeadlineDialog() {
        if (deadlineDialog.open) deadlineDialog.close();
      }

      deadlineDialog.addEventListener("click", (event) => {
        if (event.target === deadlineDialog) closeDeadlineDialog();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && deadlineDialog.open) {
          event.preventDefault();
          closeDeadlineDialog();
        }
      });

      deadlineDialog.addEventListener("close", () => {
        activeDeadlineId = null;
        deadlineEditForm.hidden = true;
        deadlineDateForm.hidden = true;
        deadlineEditButton.disabled = false;
        deadlineDateEditButton.disabled = false;
        deadlineDeleteConfirmation.hidden = true;
        document.querySelector("#deadline-dialog-actions").hidden = false;
        if (dialogTrigger?.isConnected) dialogTrigger.focus();
        dialogTrigger = null;
      });

      document.querySelector("#deadline-dialog-close").addEventListener("click", closeDeadlineDialog);

      deadlineEditButton.addEventListener("click", () => {
        const task = tasks.find((item) => item.id === activeDeadlineId);
        if (!task) return;
        deadlineDialogStatus.textContent = "";
        deadlineDateForm.hidden = true;
        deadlineDateEditButton.disabled = false;
        deadlineEditName.value = task.description;
        deadlineEditForm.hidden = false;
        deadlineEditButton.disabled = true;
        deadlineEditName.focus();
      });

      deadlineDateEditButton.addEventListener("click", () => {
        const task = tasks.find((item) => item.id === activeDeadlineId);
        if (!task) return;
        deadlineDialogStatus.textContent = "";
        deadlineEditForm.hidden = true;
        deadlineEditButton.disabled = false;
        deadlineEditDate.value = task.date;
        deadlineDateForm.hidden = false;
        deadlineDateEditButton.disabled = true;
        deadlineEditDate.focus();
      });

      document.querySelector("#deadline-edit-cancel").addEventListener("click", () => {
        deadlineEditForm.hidden = true;
        deadlineEditButton.disabled = false;
        deadlineDialogStatus.textContent = "";
        deadlineEditButton.focus();
      });

      document.querySelector("#deadline-date-cancel").addEventListener("click", () => {
        deadlineDateForm.hidden = true;
        deadlineDateEditButton.disabled = false;
        deadlineDialogStatus.textContent = "";
        deadlineDateEditButton.focus();
      });

      deadlineEditForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const description = deadlineEditName.value.trim();
        if (!description) {
          deadlineDialogStatus.textContent = "Deadline name cannot be empty.";
          deadlineEditName.focus();
          return;
        }
        if (description.length > 160) {
          deadlineDialogStatus.textContent = "Deadline name must be 160 characters or fewer.";
          deadlineEditName.focus();
          return;
        }
        if (!sharedStore || !activeDeadlineId) {
          deadlineDialogStatus.textContent = "Shared sync is not available. Try again after reconnecting.";
          return;
        }

        try {
          await sharedStore.update("deadlines", activeDeadlineId, { description });
          const task = tasks.find((item) => item.id === activeDeadlineId);
          if (task) renderDeadlineDialog({ ...task, description });
          deadlineEditForm.hidden = true;
          deadlineEditButton.disabled = false;
          deadlineDialogStatus.textContent = "Deadline name updated.";
          deadlineEditButton.focus();
        } catch (error) {
          deadlineDialogStatus.textContent = `Could not update deadline: ${error.message}`;
          console.error("Unable to update shared deadline:", error);
        }
      });

      deadlineDateForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const date = deadlineEditDate.value;
        if (!date) {
          deadlineDialogStatus.textContent = "Choose a date for this deadline.";
          deadlineEditDate.focus();
          return;
        }
        if (!sharedStore || !activeDeadlineId) {
          deadlineDialogStatus.textContent = "Shared sync is not available. Try again after reconnecting.";
          return;
        }

        try {
          await sharedStore.update("deadlines", activeDeadlineId, { date });
          const task = tasks.find((item) => item.id === activeDeadlineId);
          if (task) renderDeadlineDialog({ ...task, date });
          deadlineDateForm.hidden = true;
          deadlineDateEditButton.disabled = false;
          deadlineDialogStatus.textContent = "Deadline date updated.";
          deadlineDateEditButton.focus();
        } catch (error) {
          deadlineDialogStatus.textContent = `Could not update deadline date: ${error.message}`;
          console.error("Unable to update shared deadline date:", error);
        }
      });

      document.querySelector("#deadline-delete-button").addEventListener("click", () => {
        deadlineDialogStatus.textContent = "";
        deadlineDeleteConfirmation.hidden = false;
        document.querySelector("#deadline-dialog-actions").hidden = true;
        document.querySelector("#deadline-delete-confirm").focus();
      });

      document.querySelector("#deadline-delete-cancel").addEventListener("click", () => {
        deadlineDeleteConfirmation.hidden = true;
        document.querySelector("#deadline-dialog-actions").hidden = false;
        deadlineDialogStatus.textContent = "";
        document.querySelector("#deadline-delete-button").focus();
      });

      document.querySelector("#deadline-delete-confirm").addEventListener("click", async () => {
        if (!sharedStore || !activeDeadlineId) {
          deadlineDialogStatus.textContent = "Shared sync is not available. Try again after reconnecting.";
          return;
        }

        const taskId = activeDeadlineId;
        try {
          await sharedStore.delete("deadlines", taskId);
          closeDeadlineDialog();
          formStatus.textContent = "Deadline deleted from the shared calendar.";
        } catch (error) {
          deadlineDialogStatus.textContent = `Could not delete deadline: ${error.message}`;
          console.error("Unable to delete shared deadline:", error);
        }
      });

      function loadLegacyTasks() {
        try {
          const storedTasks = localStorage.getItem(storageKey);
          if (!storedTasks) return [];

          const parsedTasks = JSON.parse(storedTasks);
          if (
            !Array.isArray(parsedTasks) ||
            !parsedTasks.every(
              (task) =>
                task &&
                Number.isInteger(task.id) &&
                typeof task.description === "string" &&
                typeof task.date === "string" &&
                getSubjectList(task).length > 0,
            )
          ) {
            throw new Error("Saved calendar tasks have an invalid format.");
          }

          return parsedTasks;
        } catch (error) {
          formStatus.textContent = `Could not load saved tasks: ${error.message}`;
          return [];
        }
      }

      function renderCalendar() {
        const firstWeekday = new Date(displayedYear, displayedMonth, 1).getDay();
        const daysInMonth = new Date(displayedYear, displayedMonth + 1, 0).getDate();
        const daysInPreviousMonth = new Date(displayedYear, displayedMonth, 0).getDate();
        const cellCount = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

        monthHeading.textContent = new Intl.DateTimeFormat(undefined, {
          month: "long",
          year: "numeric",
        }).format(new Date(displayedYear, displayedMonth, 1));
        calendarGrid.replaceChildren();

        weekdays.forEach((weekday) => {
          const heading = document.createElement("div");
          heading.className = "weekday";
          heading.setAttribute("role", "columnheader");
          heading.textContent = weekday;
          calendarGrid.append(heading);
        });

        for (let index = 0; index < cellCount; index += 1) {
          const dayOffset = index - firstWeekday + 1;
          const isCurrentMonth = dayOffset > 0 && dayOffset <= daysInMonth;
          const date = isCurrentMonth
            ? new Date(displayedYear, displayedMonth, dayOffset)
            : dayOffset <= 0
              ? new Date(displayedYear, displayedMonth - 1, daysInPreviousMonth + dayOffset)
              : new Date(displayedYear, displayedMonth + 1, dayOffset - daysInMonth);
          const cell = document.createElement("div");
          const dayNumber = document.createElement("span");
          const dateKey = formatDateKey(
            date.getFullYear(),
            date.getMonth(),
            date.getDate(),
          );

          cell.className = "day";
          cell.setAttribute("role", "gridcell");
          cell.setAttribute(
            "aria-label",
            `${new Intl.DateTimeFormat(undefined, {
              dateStyle: "full",
            }).format(date)}${isCurrentMonth ? "" : ", outside current month"}`,
          );
          if (!isCurrentMonth) cell.classList.add("is-outside-month");
          if (
            date.getFullYear() === today.getFullYear() &&
            date.getMonth() === today.getMonth() &&
            date.getDate() === today.getDate()
          ) {
            cell.classList.add("is-today");
          }

          dayNumber.className = "day-number";
          dayNumber.textContent = String(date.getDate());
          cell.append(dayNumber);

          const matchingTasks = tasks.filter((task) => task.date === dateKey);
          if (matchingTasks.length > 0) {
            const taskList = document.createElement("ul");
            taskList.className = "task-list";
            taskList.setAttribute("aria-label", "Tasks");

            matchingTasks.forEach((task) => {
              const item = document.createElement("li");
              const taskButton = document.createElement("button");

              taskButton.className = "task-badge";
              taskButton.type = "button";
              const taskSubjects = getSubjectList(task);
              taskButton.style.background = getSubjectBackground(
                taskSubjects,
                subjectColors,
                rainbowBands,
              );
              taskButton.style.setProperty("--badge-color", subjectColors[taskSubjects[0]]);
              taskButton.setAttribute(
                "aria-label",
                `${taskSubjects.join(", ")} deadline: ${task.description}. Select to edit or delete.`,
              );
              const description = document.createElement("span");
              description.textContent = task.description;
              const subjects = document.createElement("span");
              subjects.className = "task-subjects";
              subjects.textContent = taskSubjects.join(" · ");
              taskButton.append(description, subjects);
              taskButton.addEventListener("click", () => {
                openDeadlineDialog(task.id, taskButton);
              });

              item.append(taskButton);
              taskList.append(item);
            });

            cell.append(taskList);
          }

          calendarGrid.append(cell);
        }
      }

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const description = descriptionInput.value.trim();

        if (!description || !dateInput.value) {
          formStatus.textContent = "Enter a task description and choose a date.";
          return;
        }
        const subjects = getSelectedSubjects();
        if (subjects.length === 0) {
          formStatus.textContent = "Select at least one subject.";
          document.querySelector("#task-subject-summary").focus();
          return;
        }

        if (!sharedStore) {
          formStatus.textContent = "Shared sync is not configured. Follow FIREBASE_SETUP.md.";
          return;
        }

        try {
          await sharedStore.add("deadlines", {
            description,
            subjects: getSubjectMap(subjects),
            date: dateInput.value,
          });
          formStatus.textContent = "Task added to the shared calendar.";
          taskForm.reset();
          updateSubjectSummary();
          dateInput.value = formatDateKey(
            today.getFullYear(),
            today.getMonth(),
            today.getDate(),
          );
          descriptionInput.focus();
        } catch (error) {
          formStatus.textContent = `Could not add task: ${error.message}`;
          console.error("Unable to add shared task:", error);
        }
      });

      document.querySelector("#previous-month").addEventListener("click", () => {
        displayedMonth -= 1;
        if (displayedMonth < 0) {
          displayedMonth = 11;
          displayedYear -= 1;
        }
        renderCalendar();
      });

      document.querySelector("#next-month").addEventListener("click", () => {
        displayedMonth += 1;
        if (displayedMonth > 11) {
          displayedMonth = 0;
          displayedYear += 1;
        }
        renderCalendar();
      });

      dateInput.value = formatDateKey(
        today.getFullYear(),
        today.getMonth(),
        today.getDate(),
      );
      renderSubjectPicker();
      renderColorLegend();
      renderCalendar();

      try {
        sharedStore = createSharedStore();
        sharedStore.watch(
          "deadlines",
          (items) => {
            tasks = items.filter(
              (task) =>
                task &&
                typeof task.id === "string" &&
                typeof task.description === "string" &&
                typeof task.date === "string" &&
                getSubjectList(task).length > 0,
            )
              .map((task) => ({ ...task, subjects: getSubjectMap(getSubjectList(task)) }));
            renderCalendar();
            formStatus.textContent = "Connected to the live shared calendar.";
          },
          (error) => {
            formStatus.textContent = `Could not sync deadlines: ${error.message}`;
            console.error("Unable to sync shared deadlines:", error);
          },
        );
        void sharedStore
          .importLegacy("deadlines", loadLegacyTasks())
          .then((count) => {
            if (count > 0) {
              formStatus.textContent = `Imported ${count} saved deadline(s) to the shared calendar.`;
            }
          })
          .catch((error) => {
            formStatus.textContent = `Could not import saved deadlines: ${error.message}`;
            console.error("Unable to import legacy deadlines:", error);
          });
      } catch (error) {
        formStatus.textContent = error.message;
      }
    </script>
  </body>
</html>
